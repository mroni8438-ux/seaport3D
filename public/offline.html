<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Koneksi Terputus — SeaPort 3D</title>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: #070d1e;
      color: #f8fafc;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 16px;
      text-align: center;
    }
    .box {
      max-width: 420px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }
    h1 { font-size: 20px; margin-bottom: 8px; color: #38bdf8; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.5; margin-bottom: 24px; }
    button {
      background: linear-gradient(135deg, #0284c7 0%, #0ea5e9 100%);
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>⚓ Sinyal Terputus</h1>
    <p>Perangkat Anda sedang offline atau koneksi ke pelabuhan terputus. Pastikan koneksi internet aktif, lalu coba muat ulang.</p>
    <button onclick="location.reload()">Muat Ulang Dashboard</button>
  </div>
</body>
</html>
